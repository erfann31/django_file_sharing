{% extends "base.html" %}

{% block content %}
<div class="text-center">
    <div class="icon-circle mb-4" style="border-color:rgba(127,255,95,.3);background:rgba(127,255,95,.07);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent2);">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
    </div>

    <div class="section-head" style="justify-content:center;">
        <span class="section-tag" style="border-color:rgba(127,255,95,.3);color:var(--accent2);background:rgba(127,255,95,.07);">transfer complete</span>
    </div>

    <p style="font-family:var(--font);font-size:11px;letter-spacing:3px;color:var(--text2);margin-bottom:24px;">// ALL FILES RECEIVED //</p>

    <div class="d-flex justify-content-center gap-3">
        <a class="btn btn-primary" href="/upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 16 12 12 8 16"/>
                <line x1="12" y1="12" x2="12" y2="21"/>
                <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
            </svg>
            Upload More
        </a>
        <a class="btn btn-secondary" href="/file-list">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            View Files
        </a>
        <a class="btn btn-secondary" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Home
        </a>
    </div>
    <div class="d-flex justify-content-center gap-3">

</div>
{% endblock %}
