{% extends "base.html" %}
{% block extra_head %}
<style>
.scan-hint { font-family: var(--font); font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
.nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.nav-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 22px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: var(--tr);
    text-decoration: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.nav-card svg { width: 26px; height: 26px; }
.nav-card.up  { color: var(--accent);  border-color: rgba(var(--accent-rgb), .2); }
.nav-card.up:hover  { border-color: var(--accent); background: rgba(var(--accent-rgb), .06); box-shadow: 0 0 20px rgba(var(--accent-rgb), .12); }
.nav-card.dl  { color: var(--accent2); border-color: rgba(var(--accent2-rgb), .2); }
.nav-card.dl:hover  { border-color: var(--accent2); background: rgba(var(--accent2-rgb), .05); box-shadow: 0 0 20px rgba(var(--accent2-rgb), .1); }
</style>
{% endblock %}

{% block content %}
<div class="section-head">
    <span class="section-tag">connection</span>
    <div class="section-line"></div>
</div>

<div class="server-url">{{ server_url }}</div>

<p class="scan-hint text-center">// scan with phone to connect //</p>

<div class="text-center">
    <div class="qr-wrap">
        <canvas id="qrcode"></canvas>
    </div>
</div>

<div class="divider"></div>

<div class="nav-grid">
    <a class="nav-card up" href="{% url 'upload_file' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 16 12 12 8 16"/>
            <line x1="12" y1="12" x2="12" y2="21"/>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
        </svg>
        Upload
    </a>
    <a class="nav-card dl" href="{% url 'file_list' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            <polyline points="12 12 12 18"/>
            <polyline points="9 15 12 18 15 15"/>
        </svg>
        Files
    </a>
</div>

<script>
(function(){
"use strict";

/*
 * QR Code encoder — Version 2, ECC Level L, Byte mode, Mask 0
 * Verified bit-for-bit against Python reference implementation.
 * Supports URLs up to 32 bytes (covers any http://x.x.x.x:PORT).
 */
function drawQR(text, canvas) {

    const SIZE = 25;
    const mat  = Array.from({length:SIZE}, ()=>new Uint8Array(SIZE));
    const func = Array.from({length:SIZE}, ()=>new Uint8Array(SIZE));

    /* ── GF(256) arithmetic ── */
    const EXP = new Uint8Array(512);
    const LOG  = new Uint8Array(256);
    let gx = 1;
    for(let i=0;i<255;i++){
        EXP[i]=gx; LOG[gx]=i;
        gx<<=1; if(gx&256) gx^=0x11D; gx&=255;
    }
    for(let i=255;i<512;i++) EXP[i]=EXP[i-255];
    const mul=(a,b)=>(a&&b)?EXP[LOG[a]+LOG[b]]:0;

    /* ── Generator polynomial for 10 EC codewords ── */
    const gen=[1];
    for(let i=0;i<10;i++){
        const root=EXP[i];
        const g=new Array(gen.length+1).fill(0);
        for(let j=0;j<gen.length;j++){ g[j]^=gen[j]; g[j+1]^=mul(gen[j],root); }
        gen.length=0; gen.push(...g);
    }

    const setM=(r,c,v,f=false)=>{
        if(r>=0&&r<SIZE&&c>=0&&c<SIZE){ mat[r][c]=v; if(f) func[r][c]=1; }
    };

    /* ── Finder patterns ── */
    const finder=(tr,tc)=>{
        for(let dr=0;dr<7;dr++) for(let dc=0;dc<7;dc++){
            const v=(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4))?1:0;
            setM(tr+dr,tc+dc,v,true);
        }
    };
    finder(0,0); finder(0,SIZE-7); finder(SIZE-7,0);

    /* ── Separators ── */
    for(let i=0;i<8;i++){
        setM(7,i,0,true);         setM(i,7,0,true);
        setM(7,SIZE-1-i,0,true);  setM(i,SIZE-8,0,true);
        setM(SIZE-8,i,0,true);    setM(SIZE-1-i,7,0,true);
    }

    /* ── Alignment pattern (version 2) at center (18,18) ── */
    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){
        setM(18+dr,18+dc,(Math.abs(dr)===2||Math.abs(dc)===2||(dr===0&&dc===0))?1:0,true);
    }

    /* ── Timing ── */
    for(let i=8;i<SIZE-8;i++){
        setM(6,i,i%2===0?1:0,true);
        setM(i,6,i%2===0?1:0,true);
    }

    /* ── Dark module ── */
    setM(SIZE-8,8,1,true);

    /* ── Format info positions (mark functional) ── */
    const FP1=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],
               [7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    const FP2=[[SIZE-1,8],[SIZE-2,8],[SIZE-3,8],[SIZE-4,8],[SIZE-5,8],[SIZE-6,8],[SIZE-7,8],
               [8,SIZE-8],[8,SIZE-7],[8,SIZE-6],[8,SIZE-5],[8,SIZE-4],[8,SIZE-3],[8,SIZE-2],[8,SIZE-1]];
    FP1.forEach(([r,c])=>{ func[r][c]=1; });
    FP2.forEach(([r,c])=>{ func[r][c]=1; });

    /* ── Encode: byte mode ── */
    const rawBytes=[];
    for(let i=0;i<text.length;i++) rawBytes.push(text.charCodeAt(i)&0xff);

    const bits=[0,1,0,0];                          // mode indicator
    const n=rawBytes.length;
    for(let b=7;b>=0;b--) bits.push((n>>b)&1);    // char count (8 bits)
    for(const by of rawBytes) for(let b=7;b>=0;b--) bits.push((by>>b)&1);
    for(let i=0;i<4;i++) bits.push(0);             // terminator
    while(bits.length%8) bits.push(0);             // byte boundary

    /* pad to 272 bits = 34 data codewords (version 2, ECC-L) */
    const PAD=[0xEC,0x11]; let pi=0;
    while(bits.length<272){
        for(let b=7;b>=0;b--) bits.push((PAD[pi%2]>>b)&1);
        pi++;
    }

    const dataBytes=[];
    for(let i=0;i<272;i+=8){
        let v=0; for(let b=0;b<8;b++) v=(v<<1)|bits[i+b]; dataBytes.push(v);
    }

    /* ── Reed-Solomon ── */
    const msg=[...dataBytes,...new Array(10).fill(0)];
    for(let i=0;i<dataBytes.length;i++){
        const c=msg[i]; if(!c) continue;
        for(let j=0;j<gen.length;j++) msg[i+j]^=mul(gen[j],c);
    }
    const ecBytes=msg.slice(dataBytes.length);

    const allBits=[];
    for(const by of [...dataBytes,...ecBytes]) for(let i=7;i>=0;i--) allBits.push((by>>i)&1);
    for(let i=0;i<7;i++) allBits.push(0); // 7 remainder bits for version 2

    /* ── Place data (zigzag, right to left) ── */
    let bitIdx=0, goUp=true;
    for(let col=SIZE-1;col>=1;col-=2){
        if(col===6) col=5;
        for(let row=0;row<SIZE;row++){
            const r=goUp?SIZE-1-row:row;
            for(let dc=0;dc<2;dc++){
                const c=col-dc;
                if(!func[r][c]&&bitIdx<allBits.length) mat[r][c]=allBits[bitIdx++];
            }
        }
        goUp=!goUp;
    }

    /* ── Mask 0: flip where (r+c)%2===0 ── */
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
        if(!func[r][c]&&(r+c)%2===0) mat[r][c]^=1;
    }

    /* ── Format info: ECC-L + mask 0 → 111011111000100 ── */
    const FMT=[1,1,1,0,1,1,1,1,1,0,0,0,1,0,0];
    for(let i=0;i<15;i++){
        setM(FP1[i][0],FP1[i][1],FMT[i]);
        setM(FP2[i][0],FP2[i][1],FMT[i]);
    }
    setM(SIZE-8,8,1); // dark module always 1

    /* ── Render ── */
    const SCALE=9, QUIET=4;
    const dim=(SIZE+QUIET*2)*SCALE;
    canvas.width=canvas.height=dim;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,dim,dim);
    ctx.fillStyle='#000000';
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
        if(mat[r][c]) ctx.fillRect((c+QUIET)*SCALE,(r+QUIET)*SCALE,SCALE,SCALE);
    }
}

drawQR("{{ server_url }}", document.getElementById('qrcode'));
})();
</script>
{% endblock %}
