<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>{% block title %}XFER // Local{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <style>
        /* ── OFFLINE FONT: monospace stack, no external requests ── */
        :root {
            --bg:        #080a0c;
            --surface:   #0e1115;
            --card:      #131820;
            --border:    #1e2835;
            --border2:   #2a3545;
            --accent:    #00e5ff;
            --accent2:   #7fff5f;
            --accent3:   #ff5f8f;
            --text:      #c8d8e8;
            --text2:     #7a98b8;
            --muted:     #3d5068;
            --danger:    #ff5f5f;
            --radius:    4px;
            --tr:        .15s ease;
            --font:      'Courier New', 'Lucida Console', Courier, monospace;
            --font-ui:   'Trebuchet MS', 'Segoe UI', Tahoma, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-family: var(--font-ui);
            font-size: 16px;
            line-height: 1.65;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── SCANLINE OVERLAY ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,.08) 2px,
                rgba(0,0,0,.08) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── AMBIENT GLOW ── */
        .bg-glow {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }
        .bg-glow-1 {
            width: 700px; height: 700px;
            top: -200px; left: -200px;
            background: radial-gradient(circle, rgba(0,229,255,.035) 0%, transparent 70%);
        }
        .bg-glow-2 {
            width: 500px; height: 500px;
            bottom: -100px; right: -100px;
            background: radial-gradient(circle, rgba(127,255,95,.025) 0%, transparent 70%);
        }

        /* ── GRID PATTERN ── */
        .bg-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(30,40,53,.6) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30,40,53,.6) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* ── LAYOUT ── */
        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 0 16px 48px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 0;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }
        .logo {
            display: flex;
            flex-direction: column;
            gap: 1px;
            text-decoration: none;
        }
        .logo-name {
            font-family: var(--font);
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 18px rgba(0,229,255,.35);
        }
        .logo-sub {
            font-family: var(--font);
            font-size: 9px;
            letter-spacing: 4px;
            color: var(--muted);
            text-transform: uppercase;
        }
        .status-dot {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: var(--font);
            font-size: 10px;
            color: var(--text2);
            letter-spacing: 1px;
        }
        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent2);
            box-shadow: 0 0 8px var(--accent2);
            animation: pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50%      { opacity: .4; }
        }

        /* ── CARD ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: var(--radius);
            padding: 32px 28px;
            position: relative;
            overflow: hidden;
            animation: slideIn .3s ease both;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(0,229,255,.04) 0%, transparent 100%);
            pointer-events: none;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── SECTION HEADING ── */
        .section-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .section-tag {
            font-family: var(--font);
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            padding: 3px 8px;
            border: 1px solid rgba(0,229,255,.3);
            border-radius: 2px;
            background: rgba(0,229,255,.05);
        }
        .section-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        h2 {
            font-family: var(--font);
            font-size: 20px;
            font-weight: bold;
            color: var(--text);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: var(--radius);
            border: 1px solid transparent;
            font-family: var(--font);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--tr);
            text-decoration: none;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            background: rgba(255,255,255,.06);
            transition: var(--tr);
        }
        .btn:hover::after { opacity: 1; }
        .btn:active { transform: scale(.97); }

        .btn-primary {
            background: rgba(0,229,255,.1);
            border-color: rgba(0,229,255,.4);
            color: var(--accent);
        }
        .btn-primary:hover {
            background: rgba(0,229,255,.18);
            border-color: var(--accent);
            box-shadow: 0 0 16px rgba(0,229,255,.2), inset 0 0 0 1px rgba(0,229,255,.15);
        }

        .btn-secondary {
            background: rgba(127,255,95,.07);
            border-color: rgba(127,255,95,.3);
            color: var(--accent2);
        }
        .btn-secondary:hover {
            background: rgba(127,255,95,.14);
            border-color: var(--accent2);
            box-shadow: 0 0 16px rgba(127,255,95,.15);
        }

        .btn-danger {
            background: rgba(255,95,95,.08);
            border-color: rgba(255,95,95,.3);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: rgba(255,95,95,.15);
            border-color: var(--danger);
        }

        /* ── UTILITY ── */
        .d-none    { display: none !important; }
        .d-flex    { display: flex !important; }
        .gap-3     { gap: 10px; }
        .justify-content-center { justify-content: center; }
        .text-center { text-align: center; }
        .text-muted  { color: var(--muted) !important; }
        .text-danger { color: var(--danger) !important; }
        .mb-4 { margin-bottom: 20px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-2 { margin-bottom: 8px; }
        .mt-4 { margin-top: 20px; }
        .me-2 { margin-right: 6px; }
        .text-start { text-align: left; }

        /* ── SERVER URL ── */
        .server-url {
            font-family: var(--font);
            font-size: 16px;
            color: var(--accent2);
            background: var(--surface);
            border: 1px solid var(--border2);
            padding: 12px 16px;
            border-radius: var(--radius);
            margin: 16px 0;
            letter-spacing: 1px;
            text-align: center;
            text-shadow: 0 0 12px rgba(127,255,95,.3);
            word-break: break-all;
        }

        /* ── ICON CIRCLE ── */
        .icon-circle {
            width: 72px; height: 72px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            position: relative;
        }
        .icon-circle::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            border: 1px solid rgba(0,229,255,.2);
        }
        .icon-circle svg { width: 32px; height: 32px; color: var(--accent); }

        /* ── DIVIDER ── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 20px 0;
            position: relative;
        }
        .divider::after {
            content: '//';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            font-family: var(--font);
            font-size: 10px;
            color: var(--muted);
            background: var(--card);
            padding: 0 8px;
        }

        /* ── FILE LIST ── */
        .file-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .file-list li {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: var(--tr);
        }
        .file-list li:hover {
            border-color: rgba(0,229,255,.4);
            background: rgba(0,229,255,.03);
        }
        .file-list a {
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            font-family: var(--font);
            font-size: 13px;
            letter-spacing: .5px;
        }
        .file-list a svg { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }
        .file-list a:hover { color: var(--accent); }

        /* ── UPLOAD AREA ── */
        .upload-area {
            border: 1px dashed var(--border2);
            border-radius: var(--radius);
            padding: 36px 20px;
            cursor: pointer;
            transition: var(--tr);
            text-align: center;
            margin-bottom: 14px;
            background: var(--surface);
            position: relative;
            overflow: hidden;
        }
        .upload-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,229,255,.03), transparent 60%);
            pointer-events: none;
        }
        .upload-area:hover, .upload-area.drag-over {
            border-color: var(--accent);
            background: rgba(0,229,255,.04);
        }
        .upload-area svg { width: 40px; height: 40px; color: var(--accent); margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }
        .upload-area p { color: var(--text2); font-family: var(--font); font-size: 13px; letter-spacing: 1px; }
        #file-input { display: none; }

        /* ── FILE QUEUE ── */
        #file-queue { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 12px;
            font-family: var(--font);
            font-size: 12px;
            letter-spacing: .5px;
        }
        .file-item > span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
        .file-item .progress-container { display: flex; align-items: center; gap: 8px; min-width: 80px; }
        .file-item .progress-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 2px;
            width: 0%;
            transition: width .2s ease;
            flex: 1;
        }
        .progress-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .file-item .progress-text { font-size: 10px; color: var(--muted); min-width: 28px; text-align: right; }
        .remove-file { cursor: pointer; color: var(--muted); transition: var(--tr); flex-shrink: 0; }
        .remove-file:hover { color: var(--danger); }
        .remove-file svg { width: 14px; height: 14px; display: block; }

        /* ── PROGRESS ── */
        #progress-container { flex-direction: column; gap: 6px; margin: 12px 0; }
        .progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; width: 100%; }
        #overall-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 2px;
            width: 0%;
            transition: width .3s ease;
            box-shadow: 0 0 8px rgba(0,229,255,.4);
        }
        #overall-progress-text { font-family: var(--font); font-size: 11px; color: var(--text2); text-align: center; letter-spacing: 2px; }

        #file-warning { font-family: var(--font); font-size: 11px; margin-top: 8px; letter-spacing: 1px; }

        /* ── QR WRAP ── */
        .qr-wrap {
            background: white;
            padding: 12px;
            border-radius: var(--radius);
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0,229,255,.1);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .card { padding: 22px 16px; }
            .btn { padding: 9px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="page-wrapper">
    <header class="topbar">
        <a href="/" class="logo">
            <span class="logo-name">XFER</span>
            <span class="logo-sub">local file transfer</span>
        </a>
        <div class="status-dot">
            <span class="dot"></span>
            <span>ONLINE</span>
        </div>
    </header>

    <div class="card">
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
