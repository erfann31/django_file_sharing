name: Build and release LocalShare

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: localshare-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: localshare-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LocalShare.exe -DestinationPath LocalShare-windows-x64.zip

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: bash build_linux.sh

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -C dist -czf LocalShare-linux-x64.tar.gz LocalShare

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: LocalShare-*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "LocalShare $GITHUB_REF_NAME" --generate-notes
