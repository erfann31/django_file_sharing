name: Build and release LocalShare

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_macos:
        description: "Also build the macOS application"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: localshare-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            artifact: localshare-linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LocalShare.exe -DestinationPath LocalShare-windows-x64.zip

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: bash build_linux.sh

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -C dist -czf LocalShare-linux-x64.tar.gz LocalShare localshare-logo.png

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: LocalShare-*
          if-no-files-found: error

  build_macos:
    name: Build (macOS Intel)
    # macOS runners are opt-in because they are more expensive. Include them
    # for release tags ending in "-mac" (for example, v1.2.0-mac), or when
    # the checkbox is selected for a manually dispatched workflow.
    if: ${{ endsWith(github.ref_name, '-mac') || inputs.include_macos }}
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS application
        run: python3 build_mac.py

      - name: Package macOS application
        run: tar -C dist -czf LocalShare-macos-x64.tar.gz LocalShare.app

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: localshare-macos-x64
          path: LocalShare-macos-x64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build, build_macos]
    # A skipped optional macOS build must not prevent the tag release.
    if: ${{ always() && needs.build.result == 'success' && (needs.build_macos.result == 'success' || needs.build_macos.result == 'skipped') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "LocalShare $GITHUB_REF_NAME" --generate-notes
